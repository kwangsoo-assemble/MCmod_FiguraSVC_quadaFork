plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Simple Voice Chat API
	maven { url = "https://maven.maxhenkel.de/repository/public" }
	// Figura 의 LuaJ 포크 — 코어 jar 안에는 중첩 jar 로만 들어 있어서 컴파일용으로 따로 건다
	maven { url = "https://jitpack.io" }
}

loom {
	accessWidenerPath = file("src/main/resources/figurasvc.accesswidener")

	mods {
		"figurasvc" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// 커스텀 Figura 포크 (../figura_core_internal 빌드 산출물을 .libs 에 복사) — 런타임에는 게임의 Figura 가 쓴다
	modCompileOnly files(".libs/${project.figura_jar}")
	compileOnly "com.github.FiguraMC.luaj:luaj-core:${project.luaj_version}"
	compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
}

processResources {
	def props = [
		"version"       : project.version,
		"mod_id"        : project.archives_base_name,
		"display_name"  : project.display_name,
		"description"   : project.description,
		"authors"       : project.authors,
		"figura_version": project.figura_version,
	]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def name = project.base.archivesName.get()
	from("LICENSE") {
		rename { "${it}_${name}" }
	}
}
